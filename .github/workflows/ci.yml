name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (warning level, follows sourced files)
        run: |
          docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:v0.10.0 -S warning -x \
            $(git ls-files '*.sh' 'bin/*' | grep -v '^tests/reference_v1')

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bats (lib/tuning.sh and nginx/autodeploy-nginx.sh behaviour)
        run: docker run --rm -v "$PWD:/code:ro" bats/bats:1.11.1 tests
