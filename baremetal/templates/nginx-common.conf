# /etc/nginx/snippets/${SERVICE}-common.conf - proxy settings and locations shared by
# the plain-http server and the https server. Generated by baremetal/install.sh.
client_max_body_size 256M;
proxy_read_timeout 900s;
proxy_connect_timeout 900s;
proxy_send_timeout 900s;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Host $http_host;
proxy_buffers 16 64k;
proxy_buffer_size 128k;

gzip on;
gzip_min_length 1024;
gzip_types text/css text/plain text/xml application/xml application/json application/javascript text/javascript image/svg+xml font/woff2;
gzip_vary on;

access_log /var/log/nginx/${SERVICE}.access.log;
error_log  /var/log/nginx/${SERVICE}.error.log;

location /websocket {
    proxy_pass http://${SERVICE}chat;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
}

# bundled assets are content-hashed: cache them hard in nginx and in browsers
location ~ ^/web/assets/ {
    proxy_pass http://${SERVICE};
    proxy_cache ${SERVICE}_assets;
    proxy_cache_valid 200 14d;
    proxy_cache_use_stale error timeout updating;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    add_header X-Cache $upstream_cache_status;
    expires 14d;
}
location ~* ^/[^/]+/static/ {
    proxy_pass http://${SERVICE};
    proxy_cache ${SERVICE}_assets;
    proxy_cache_valid 200 1d;
    proxy_ignore_headers Set-Cookie;
    expires 1d;
}

location / {
    proxy_pass http://${SERVICE};
    proxy_redirect off;
}
