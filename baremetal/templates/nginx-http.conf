# /etc/nginx/sites-available/${SERVICE} - plain http (LAN / before TLS). Generated by baremetal/install.sh.
upstream ${SERVICE}     { server 127.0.0.1:${HTTP_PORT}; keepalive ${NGINX_KEEPALIVE}; }
upstream ${SERVICE}chat { server 127.0.0.1:${GEVENT_PORT}; }
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

proxy_cache_path /var/cache/nginx/${SERVICE} levels=1:2 keys_zone=${SERVICE}_assets:64m max_size=2g inactive=14d use_temp_path=off;

server {
    listen ${NGINX_PORT}${DEFAULT_SERVER};
    listen [::]:${NGINX_PORT}${DEFAULT_SERVER};
    server_name ${HTTP_SERVER_NAMES};

    # Let's Encrypt http-01 challenges (certbot --webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    include snippets/${SERVICE}-common.conf;
}
