; ${PROJECT} - Odoo ${ODOO_VERSION} ${ODOO_EDITION}, bare metal, generated by baremetal/install.sh
; Machine: ${CPU_CORES} cores, ${TOTAL_RAM_MB} MB RAM. Sizes from lib/tuning.sh.
[options]
addons_path = ${ADDONS_PATH}
data_dir = ${DATA_DIR}
admin_passwd = ${ADMIN_PASSWD}

; database: local unix socket, peer auth (no password, no TCP). db_host is left
; unset on purpose: that selects the socket, and Odoo 19 warns about "False".
db_port = ${PG_PORT}
db_user = ${ODOO_USER}
db_name = ${DB_NAME}
dbfilter = ^${DB_NAME}$
list_db = False
db_maxconn = ${DB_MAXCONN}
unaccent = True

; http
http_interface = ${HTTP_INTERFACE}
http_port = ${HTTP_PORT}
gevent_port = ${GEVENT_PORT}
proxy_mode = ${PROXY_MODE}

; multiprocessing: ${OPTIMAL_WORKERS} workers + ${MAX_CRON_THREADS} cron threads,
; ${SOFT_LIMIT_MB} MB soft / ${WORKER_MEMORY_MB} MB hard per worker
workers = ${OPTIMAL_WORKERS}
max_cron_threads = ${MAX_CRON_THREADS}
limit_memory_soft = ${SOFT_LIMIT_BYTES}
limit_memory_hard = ${HARD_LIMIT_BYTES}
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = 1800
transient_age_limit = 1.0
osv_memory_count_limit = 0

; logging
logfile = ${LOG_DIR}/odoo.log
log_level = info
log_handler = :INFO,werkzeug:WARNING,odoo.http.rpc.request:WARNING
syslog = False

server_wide_modules = base,web
