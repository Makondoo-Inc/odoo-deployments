# PostgreSQL ${PG_VERSION} tuning for Odoo, generated by baremetal/install.sh
# Machine: ${CPU_CORES} cores, ${TOTAL_RAM_MB} MB RAM, data on ${PG_DISK_KIND} storage
# Values come from lib/tuning.sh; edit there, not here.
listen_addresses = ''                 # unix socket only; Odoo runs on this host
max_connections = ${MAX_CONNECTIONS}
superuser_reserved_connections = 5
shared_buffers = ${SHARED_BUFFERS}MB  # ~25% of RAM, capped at 16 GB
huge_pages = ${PG_HUGE_PAGES}
effective_cache_size = ${EFFECTIVE_CACHE_SIZE}MB
work_mem = ${WORK_MEM}MB              # bounded by max_connections so a full box cannot OOM
maintenance_work_mem = ${MAINTENANCE_WORK_MEM}MB
autovacuum_work_mem = ${AUTOVACUUM_WORK_MEM}MB
temp_buffers = 32MB
max_locks_per_transaction = 256       # Odoo touches hundreds of tables per transaction (module updates)
wal_level = replica
wal_compression = ${WAL_COMPRESSION}
wal_buffers = 64MB
min_wal_size = ${MIN_WAL_SIZE}
max_wal_size = ${MAX_WAL_SIZE}
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
synchronous_commit = on               # durable; off only if losing the last ~1 s on power loss is acceptable
full_page_writes = on
bgwriter_lru_maxpages = 400
bgwriter_delay = 100ms
random_page_cost = ${RANDOM_PAGE_COST}
seq_page_cost = 1.0
effective_io_concurrency = ${IO_CONCURRENCY}
maintenance_io_concurrency = ${IO_CONCURRENCY}
default_statistics_target = 100
jit = off                             # Odoo queries are small; JIT compile cost dominates
max_worker_processes = ${MAX_WORKER_PROCESSES}
max_parallel_workers = ${MAX_PARALLEL_WORKERS}
max_parallel_workers_per_gather = ${MAX_PARALLEL_PER_GATHER}
max_parallel_maintenance_workers = ${MAX_PARALLEL_MAINTENANCE}
autovacuum = on
autovacuum_max_workers = ${AUTOVACUUM_WORKERS}
autovacuum_naptime = 20s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 1000
autovacuum_vacuum_cost_delay = 2ms
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
track_io_timing = on
track_activity_query_size = 4096
log_min_duration_statement = 2000     # slow query log (ms)
log_checkpoints = on
log_lock_waits = on
log_temp_files = 64MB
log_autovacuum_min_duration = 10s
log_line_prefix = '%m [%p] %u@%d '
timezone = 'UTC'
log_timezone = 'UTC'
idle_in_transaction_session_timeout = 0
statement_timeout = 0
lc_messages = 'C'
${PG18_IO}
